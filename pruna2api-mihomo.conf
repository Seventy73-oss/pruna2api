[Unit]
# mihomo 是出口池的前提，必须比 pruna2api 先就绪
Wants=mihomo-pruna.service
After=mihomo-pruna.service

[Service]
# 出口来源切到自带的 mihomo（订阅节点池），不再依赖容器里的系统 clash
Environment=PRUNA_EXIT_SOURCE=mihomo
Environment=PRUNA_MIHOMO_API=http://127.0.0.1:9091
Environment=PRUNA_MIHOMO_PROXY=http://127.0.0.1:7891
Environment=PRUNA_MIHOMO_GROUP=PRUNA
